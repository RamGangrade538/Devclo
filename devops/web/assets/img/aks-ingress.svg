<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 636" width="100%" style="background:#fbfbfc;border:1px solid #e6e8ef;border-radius:12px;font-family:'Inter','Segoe UI',system-ui,sans-serif" role="img" aria-label="NGINX Ingress Controller on AKS">
<rect width="860" height="636" fill="#fbfbfc"/>
<text x="30" y="26" font-size="19" font-weight="800" fill="#0f172a">NGINX Ingress Controller on AKS</text>
<text x="30" y="46" font-size="12.5" fill="#64748b">External HTTP(S) → Ingress → Service → Pods</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<line x1="430" y1="128" x2="430" y2="176" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="430" y1="242" x2="430" y2="290" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="430" y1="356" x2="430" y2="404" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="430" y1="470" x2="430" y2="518" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="30" y="62" width="800" height="66" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="430" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">External Traffic</text>
<text x="430" y="112" text-anchor="middle" font-size="10.5" fill="#64748b">curl https://your-app.example.com</text>
<rect x="30" y="176" width="800" height="66" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="430" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">Service (LB)</text>
<text x="430" y="226" text-anchor="middle" font-size="10.5" fill="#64748b">public IP / Azure LB</text>
<rect x="30" y="290" width="800" height="66" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="430" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">NGINX Ingress</text>
<text x="430" y="340" text-anchor="middle" font-size="10.5" fill="#64748b">TLS + route by host/path</text>
<rect x="30" y="404" width="800" height="66" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="430" y="434" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">K8s Service</text>
<text x="430" y="454" text-anchor="middle" font-size="10.5" fill="#64748b">internal ClusterIP</text>
<rect x="30" y="518" width="800" height="66" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="430" y="548" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">Pods</text>
<text x="430" y="568" text-anchor="middle" font-size="10.5" fill="#64748b">app replicas (backend)</text>
<text x="30" y="616" font-size="11.5" fill="#64748b">Host header = web pe kaunsa app, path = kaunsa service. Certificates: cert-manager + Let's Encrypt (day 49).</text>
</svg>