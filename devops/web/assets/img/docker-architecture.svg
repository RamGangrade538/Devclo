<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 378" width="100%" style="background:#fbfbfc;border:1px solid #e6e8ef;border-radius:12px;font-family:'Inter','Segoe UI',system-ui,sans-serif" role="img" aria-label="Docker Architecture">
<rect width="860" height="378" fill="#fbfbfc"/>
<text x="30" y="26" font-size="19" font-weight="800" fill="#0f172a">Docker Architecture</text>
<text x="30" y="46" font-size="12.5" fill="#64748b">Client-server model: CLI → daemon → containers</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<line x1="430" y1="128" x2="430" y2="176" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="430" y="147" text-anchor="middle" font-size="10.5" fill="#475569">REST API request</text>
<line x1="430" y1="242" x2="618" y2="290" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="524" y="261" text-anchor="middle" font-size="10.5" fill="#475569">build / run engine</text>
<line x1="430" y1="242" x2="242" y2="290" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="430" y1="242" x2="618" y2="290" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="62" width="800" height="66" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="430" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">Docker Client</text>
<text x="430" y="112" text-anchor="middle" font-size="10.5" fill="#64748b">docker build / run / push (CLI)</text>
<rect x="30" y="176" width="800" height="66" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
<text x="430" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">Docker Daemon (dockerd)</text>
<text x="430" y="226" text-anchor="middle" font-size="10.5" fill="#64748b">manages objects via REST API</text>
<rect x="62" y="290" width="360" height="66" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="242" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">containerd</text>
<text x="242" y="340" text-anchor="middle" font-size="10.5" fill="#64748b">runC creates container processes</text>
<rect x="438" y="290" width="360" height="66" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="618" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">Containers</text>
<text x="618" y="340" text-anchor="middle" font-size="10.5" fill="#64748b">isolated apps + images</text>
</svg>