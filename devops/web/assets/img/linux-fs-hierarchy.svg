<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 294" width="100%" style="background:#fbfbfc;border:1px solid #e6e8ef;border-radius:12px;font-family:'Inter','Segoe UI',system-ui,sans-serif" role="img" aria-label="Linux Filesystem Hierarchy">
<rect width="860" height="294" fill="#fbfbfc"/>
<text x="30" y="26" font-size="19" font-weight="800" fill="#0f172a">Linux Filesystem Hierarchy</text>
<text x="30" y="46" font-size="12.5" fill="#64748b">Root (/) ke neeche standardized directories</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<line x1="430" y1="128" x2="498" y2="176" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="430" y1="128" x2="90" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="430" y1="128" x2="226" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="430" y1="128" x2="362" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="430" y1="128" x2="498" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="430" y1="128" x2="634" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="430" y1="128" x2="770" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="62" width="800" height="66" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
<text x="430" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">/</text>
<text x="430" y="112" text-anchor="middle" font-size="10.5" fill="#64748b">root of filesystem</text>
<rect x="30" y="176" width="120" height="66" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="90" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">/bin</text>
<text x="90" y="226" text-anchor="middle" font-size="10.5" fill="#64748b">user binaries (ls, cat)</text>
<rect x="166" y="176" width="120" height="66" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="226" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">/etc</text>
<text x="226" y="226" text-anchor="middle" font-size="10.5" fill="#64748b">config files</text>
<rect x="302" y="176" width="120" height="66" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="362" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">/home</text>
<text x="362" y="226" text-anchor="middle" font-size="10.5" fill="#64748b">user data (~/)</text>
<rect x="438" y="176" width="120" height="66" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="498" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">/var</text>
<text x="498" y="226" text-anchor="middle" font-size="10.5" fill="#64748b">logs, spool</text>
<rect x="574" y="176" width="120" height="66" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="634" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">/tmp</text>
<text x="634" y="226" text-anchor="middle" font-size="10.5" fill="#64748b">temp files</text>
<rect x="710" y="176" width="120" height="66" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="770" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">/usr</text>
<text x="770" y="226" text-anchor="middle" font-size="10.5" fill="#64748b">installed apps</text>
<text x="30" y="274" font-size="11.5" fill="#64748b">Har directory = ek specific kaam. Tumhe pata hona chahiye kaha kya hai — prod me logs /var/log me, config /etc me.</text>
</svg>