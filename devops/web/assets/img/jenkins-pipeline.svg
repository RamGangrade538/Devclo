<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 150" width="100%" style="background:#fbfbfc;border:1px solid #e6e8ef;border-radius:12px;font-family:'Inter','Segoe UI',system-ui,sans-serif" role="img" aria-label="Jenkins Pipeline Flow">
