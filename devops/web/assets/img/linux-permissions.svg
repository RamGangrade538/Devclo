<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="100%" style="background:#fbfbfc;border:1px solid #e6e8ef;border-radius:12px;font-family:'Inter','Segoe UI',system-ui,sans-serif" role="img" aria-label="Linux Permissions (rwx)">
<rect width="860" height="180" fill="#fbfbfc"/>
<text x="30" y="26" font-size="19" font-weight="800" fill="#0f172a">Linux Permissions (rwx)</text>
<text x="30" y="46" font-size="12.5" fill="#64748b">File: -rw-r--r-- user:devclo → Owner rw-, Group r--, Other r--</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="30" y="62" width="256" height="66" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="158" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">Owner</text>
<text x="158" y="112" text-anchor="middle" font-size="10.5" fill="#64748b">r w -  (read, write)</text>
<rect x="302" y="62" width="256" height="66" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="430" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">Group</text>
<text x="430" y="112" text-anchor="middle" font-size="10.5" fill="#64748b">r - -  (read only)</text>
<rect x="574" y="62" width="256" height="66" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="702" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">Other</text>
<text x="702" y="112" text-anchor="middle" font-size="10.5" fill="#64748b">r - -  (read only)</text>
<text x="30" y="160" font-size="11.5" fill="#64748b">1st tri-bit = user, 2nd = group, 3rd = others. chmod 644 / chmod u+x yaad rahe.</text>
</svg>